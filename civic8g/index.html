<html lang=en ng-app=Dashboard>

<head>
    <meta charset=UTF-8>
    <meta content="width=device-width, initial-scale=1" name=viewport>
    <title>Funkimunks ngESM</title>
    <link href=css/bootstrap.min.css rel=stylesheet type=text/css>
    <link href=css/font-awesome.min.css rel=stylesheet type=text/css>
    <link href=css/dashboard.css rel=stylesheet type=text/css>
    <link href=css/blue.css rel=stylesheet type=text/css>
    <link href=css/abn_tree.css rel=stylesheet type=text/css>
    <script type=text/javascript src id=pageData></script>
    <script type=text/javascript src=js/support/angular.min.js></script>
    <script type=text/javascript src=js/support/angular-cookies.js></script>
    <script type=text/javascript src=js/support/ng-bootstrap-tpls.min.js></script>
    <script type=text/javascript src=js/app.js></script>
    <script type=text/javascript src=js/support/angular-route.js></script>
    <script type=text/javascript src=js/support/angular-resource.js></script>
    <script type=text/javascript src=js/controllers.js></script>
    <script type=text/javascript src=js/abn_tree_directive.js></script>
	<script type=text/javascript src=A00/HTML/CTL/ILLUST.JS></script>
    <script type=text/javascript src=A00/TABLE/TREEDAT6.JS></script>
    <script type=text/javascript src=A00/TABLE/SIETITL6.JS></script>
    <script type=text/javascript>
		FIC();
        function FDL(code, model, type) {
            this.Code = code;
            this.Model = model;
            this.Type = type;
        }

        function FS1(imgID, dbKey, title) {
            var result = {
                img: imgID,
                key: dbKey,
                titlex: title
            };
            return (result);
        }

        function FS2(code, year) {
            var data = new Array;
            data.Code = code;
            data.Year = year;
            return (data);
        }

        function FS3(level, strFile, strTitle) {
            var data = {
                Level: level,
                File: strFile,
                Title: strTitle
            };
            return (data);
        }

        function FS5(id, text) {
            var data = new Array;
            data.id = id;
            data.Text = text;
            return (data);
        }

        function FS6(code, name, title) {
            var data = new Array;
            data.Code = code;
            data.Name = name;
            data.Title = title;
            return (data);
        }
    </script>
</head>

<body ng-controller=MasterCtrl style=height:100%>
    <div id=page-wrapper ng-class="{'active': toggle}" ng-cloak>
        <div id=sidebar-wrapper>
            <ul class=sidebar>
                <li class=sidebar-main><a ng-click=toggleSidebar() style=cursor:pointer> ESM <span class="menu-icon glyphicon glyphicon-transfer"></span></a></li>
                <li class=sidebar-title><span>NAVIGATION</span></li>
                <li style=margin-left:0;padding-left:0>
                    <abn-tree style=margin-left:-30px;padding-left:0;font-size:10pt tree-data=navTree on-select=tree_click_handler(branch) tree-control=nav_tree expand-level=0></abn-tree>
                </li>
            </ul>
            <div class=sidebar-footer>
                <div class=col-xs-12><a href="https://www.paypal.com/cgi-bin/webscr?cmd=_s-xclick&hosted_button_id=VJ6XCEP8Z8CD6" target=_blank> Donate to Joe Rafferty <i class="fa fa-paypal"></i></a></div>
                <div class=col-xs-12 style=margin-top:-10px><a rel=license href=http://creativecommons.org/licenses/by-nc-sa/4.0/><img alt="Creative Commons Licence" style=border-width:0 src=https://licensebuttons.net/l/by-nc-sa/4.0/88x31.png /></a>
                    <br />
                </div>
            </div>
        </div>
        <div id=content-wrapper>
            <div class=page-content>
                <div class="row header">
                    <div class=col-xs-12>
                        <div class="meta pull-left">
                            <div class="page col-lg-8"> {{title}} </div>
                        </div>
                        <div class="user pull-right col-xs-4">
                            <div class=input-group style=margin-top:8px;margin-right:12px>
                                <input type=text class=form-control placeholder="Search ESM..." id=query name=query value ng-model=searchTerm ng-keyup="$event.keyCode == 13 ? searchFunc() : null">
                                <div class=input-group-btn>
                                    <button type=submit class="btn btn-info" ng-click=searchFunc()><span class="glyphicon glyphicon-search"></span></button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class=col-xs-12 ng-show=showTable>
                    <div class="widget-body xlarge no-padding">
                        <div class=table-responsive>
                            <table class=table>
                                <tbody>
                                    <tr ng-repeat="record in documents" ng-click=openDoc(record.file) style=cursor:pointer ng-class-odd="'odd'" ng-class-even="'even'">
                                        <td ng-class-odd="'odd'" ng-class-even="'even'"><img style=margin-right:6px src=A00/PNG/CTL/{{record.icon}}.PNG> {{record.title}} </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class=col-xs-12 style=height:100%;width:100% ng-show=showFrame>
                    <iframe frameborder=0 height=2000px width=100% src ng-src={{viewURL}}></iframe>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
