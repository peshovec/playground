with(document){ESM.iDT[0]=new ISMG6E50J18526235047KBAD01();}//--></script></head><body><h2>Front Intercooler Guide Replacement</h2>NOTE:<br><ul><li>Take care not to scratch the front bumper and body.<br><li>Put on gloves to protect your hands.<br></ul><br><p><table cols="2" width="100%"><tr><td id="i010" width="1%" valign="top" nowrap>1.</td><td valign="top" width="99%"><a href="../00/SMG6E00J18513415011KDAT00.HTML">Remove the front bumper.</a><br><br></td></tr></table></p><p><table cols="2" width="100%"><tr><td id="i020" width="1%" valign="top" nowrap>2.</td><td valign="top" width="99%">Remove the bolts (A, B), then remove the front intercooler guide (C).<br><p class="FIG">&nbsp;<div class="FIG"><script>FIL(1,gESM.iDT[0],gESM.iDT[0].Width);</script></div></p></td></tr></table></p><p><table cols="2" width="100%"><tr><td id="i030" width="1%" valign="top" nowrap>3.</td><td valign="top" width="99%">Install the guide in the reverse order of removal.<br></td></tr></table></p></body></html>
