with(document){ESM.iDT[0]=new ISMG6E00J36200035049KDAD01();ESM.iDT[1]=new ISMG6E00J36200035049KDAD02();}//--></script></head><body><h2>Navigation Interface Dial Removal/Installation</h2><p><table cols="2" width="100%"><tr><td id="i010" width="1%" valign="top" nowrap>1.</td><td valign="top" width="99%"><a href="./SMG6E00J10300013151KDAT00.HTML">Remove the audio unit.</a><br><br></td></tr></table></p><p><table cols="2" width="100%"><tr><td id="i020" width="1%" valign="top" nowrap>2.</td><td valign="top" width="99%">Remove the harness cover (A).<br><p class="FIG">&nbsp;<div class="FIG"><script>FIL(1,gESM.iDT[0],gESM.iDT[0].Width);</script></div></p></td></tr></table></p><p><table cols="2" width="100%"><tr><td id="i030" width="1%" valign="top" nowrap>3.</td><td valign="top" width="99%">Disconnect the connector (A). Remove the screws, knob (B), dial (C) and the interface dial (D).<br><p class="FIG">&nbsp;<div class="FIG"><script>FIL(2,gESM.iDT[1],gESM.iDT[1].Width);</script></div></p></td></tr></table></p><p><table cols="2" width="100%"><tr><td id="i040" width="1%" valign="top" nowrap>4.</td><td valign="top" width="99%">Install the dial in reverse order of removal.<br></td></tr></table></p></body></html>
