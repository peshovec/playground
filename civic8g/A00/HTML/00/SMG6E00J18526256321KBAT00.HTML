with(document){ESM.iDT[0]=new ISMG6E00J18526256321KBAD01();}//--></script></head><body><h2>Rear Spring Seat Lower Cover Replacement</h2>NOTE: Take care not to scratch the body.<br><br><p><table cols="2" width="100%"><tr><td id="i010" width="1%" valign="top" nowrap>1.</td><td valign="top" width="99%">Remove the screw and detach the hooks (A), then remove the rear spring seat lower cover (B).<br><p class="FIG">&nbsp;<div class="FIG"><script>FIL(1,gESM.iDT[0],gESM.iDT[0].Width);</script></div></p></td></tr></table></p><p><table cols="2" width="100%"><tr><td id="i020" width="1%" valign="top" nowrap>2.</td><td valign="top" width="99%">Install the cover in the reverse order of removal, and push the hook portions into place securely.<br></td></tr></table></p></body></html>
