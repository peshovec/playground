with(document){ESM.iDT[0]=new ISMG6E00J32127100000KBAD01();}//--></script></head><body><h2>Front Fog Lights Replacement</h2><p><table cols="2" width="100%"><tr><td id="i010" width="1%" valign="top" nowrap>1.</td><td valign="top" width="99%"><a href="./SMG6E00J18526234602KBAT00.HTML">Remove the inner fender.</a><br><br></td></tr></table></p><p><table cols="2" width="100%"><tr><td id="i020" width="1%" valign="top" nowrap>2.</td><td valign="top" width="99%">Disconnect the 2P connector (A) from the front fog light (B).<br><p class="FIG">&nbsp;<div class="FIG"><script>FIL(1,gESM.iDT[0],gESM.iDT[0].Width);</script></div></p></td></tr></table></p><p><table cols="2" width="100%"><tr><td id="i030" width="1%" valign="top" nowrap>3.</td><td valign="top" width="99%">Remove the screw from the front fog light.<br><br></td></tr></table></p><p><table cols="2" width="100%"><tr><td id="i040" width="1%" valign="top" nowrap>4.</td><td valign="top" width="99%">Install the light in the reverse order of removal.<br></td></tr></table></p></body></html>
